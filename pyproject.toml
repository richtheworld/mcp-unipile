[project]
name = "mcp-server-unipile"
version = "0.1.0"
description = "A simple unipile MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0", "python-dotenv>=1.0.0", "requests>=2.31.0", "markdownify>=0.13.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-server-unipile = "mcp_server_unipile:main"
unipile-recruiter = "mcp_server_unipile.recruiter_cli:main"

[dependency-groups]
dev = ["pyright>=1.1.389"]

[tool.pyright]
include = [
  "src/mcp_server_unipile/recruiter_client.py",
  "src/mcp_server_unipile/recruiter_cli.py",
  "src/mcp_server_unipile/unipile_client.py",
]
pythonVersion = "3.11"
